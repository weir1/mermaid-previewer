version: "1.0"
project: "mermaid-previewer"
workspace_tag: "mermaid-previewer_workspace"
description: "God Mode Preflight Execution Policy — Python Stack"

rules:
  filesystem:
    autonomous_allowed:
      - paths:
          - "src/**/*.py"
          - "tests/**/*.py"
          - "scripts/**/*.py"
          - "*.md"
          # `*.md` matches ROOT-level markdown only. Nested `.md` was the
          # largest approval-gated category in almost every workspace
          # measured 2026-08-14 (@skillsforherv20 503 files, @jobscraper
          # 157, @life 100, @seo 84) — the reason the guard could not be
          # turned on without prompting for ordinary note-taking.
          - "**/*.md"
          - "*.txt"
          - ".ai/memory-bank/**/*.md"
          - ".ai/docs/**/*.md"
          - ".ai/decision-log/**/*.jsonl"
          - ".ai/session-log/**/*.json"
          - "data/README.md"
          # ── The OS's own session machinery (PH6-T21) ──────────────────
          # These are written by `just handover`, `just plan`, `just close
          # git-push`, `session_state.py` and the changelog rotator — i.e. by the
          # protocol itself, not by the agent choosing to edit something. Before
          # this block, activating the PreToolUse guard made the OS prompt on its
          # own closure sequence (measured 2026-08-13: 25-37% of tracked files
          # autonomous fleet-wide vs 90% in the kernel, with 5 protocol paths
          # requiring approval in every sampled workspace).
          # Two files are deliberately NOT here. `.ai/memory-bank/evidence.json`
          # is generated by `just verify-safe` and must never be hand-written.
          # `.ai/delegation/**` is a contract an executor must not be able to
          # edit silently: prompting on a contract write is the correct
          # behaviour, since hand-widening a `## File allowlist` is exactly what
          # delegation.py refuses to make possible.
          - ".ai/handover/**/*.md"
          - ".ai/plans/**/*.md"
          - ".ai/reviews/**/*.json"
          - ".ai/session-ledger.md"
          - ".ai/session-state.json"
          - "doc/**/*.md"
        operations: ["read", "write", "create"]
        blast_radius: "Safe Refactor"

    approval_required:
      # ── Kernel-owned gates (PH6-T21) ──────────────────────────────
      # Refused EXPLICITLY rather than by the fail-safe default for an
      # unmentioned path. `**/*.md` above makes markdown autonomous everywhere,
      # and a refusal that exists only by accident evaporates the moment a glob
      # widens. `create` is listed because a delegation contract is always a
      # new file, so a gate on `write` alone would not hold.
      - paths:
          - ".ai/memory-bank/evidence.json"
          - ".ai/delegation/**/*"
          - ".ai/plan.md"
        operations: ["write", "create", "delete"]
        blast_radius: "Destructive/Governance"
        reason: "Evidence is generated by `just verify-safe` and never typed; a delegation contract must not be editable by the executor it constrains; .ai/plan.md is the operator's own statement of intent."
      - paths:
          - "pyproject.toml"
          - "requirements*.txt"
          - "uv.lock"
          - "setup.py"
          - "setup.cfg"
        operations: ["write", "delete"]
        blast_radius: "Destructive/Dependency"
        reason: "Dependency changes affect reproducibility and CI pipelines."
      - paths:
          - "docker-compose*.yml"
          - "Dockerfile*"
          - "*.dockerfile"
        operations: ["write", "create", "delete"]
        blast_radius: "Destructive/Infrastructure"
        reason: "Container config changes affect deployment and data persistence volumes."
      - paths:
          - ".env*"
          - "*.pem"
          - "*.key"
        operations: ["write", "create", "delete"]
        blast_radius: "Destructive/Secrets"
        reason: "Secret and credential files require explicit human approval."
      - paths:
          - "alembic/**/*.py"
          - "migrations/**/*.py"
          - "migrations/**/*.sql"
        operations: ["write", "create", "delete"]
        blast_radius: "Destructive/Database"
        reason: "Database migrations can cause irreversible data loss."

    always_blocked:
      - paths: [".git/**/*"]
        # "create" is listed because `policy_hook._op_for_write` classifies a write
        # to a path that does not exist yet as a CREATE. Without it the fleet's
        # hardest rule degraded to a prompt for the case that matters most —
        # fabricating git internals from nothing (found 2026-08-14 in @moinvault,
        # which has no .git/config, so every .git write there read as a create).
        operations: ["write", "create", "delete"]
        reason: "Agent must never tamper with git history directly."

  external_actions:
    autonomous_allowed:
      - scope: "local_ci"
        commands: ["just verify-safe", "pytest", "uv pip install", "python3 scripts/"]

    approval_required:
      - scope: "llm_api_cost"
        actions: ["run_embeddings", "run_benchmark", "batch_ingest"]
        blast_radius: "Destructive/Cost"
        reason: "LLM API calls cost money. Requires explicit approval per run."
      - scope: "external_write"
        actions: ["deploy", "publish", "push_to_remote"]
        blast_radius: "Destructive/External"
        reason: "External state mutations require explicit approval."

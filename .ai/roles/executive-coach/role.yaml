# executive-coach — the self-applied-protocol role (PH8-T02, Goal G13).
#
# Derived on 2026-08-16 from the four workspaces the operator named, as they
# actually exist on disk — not from the pre-existing spec's guesses:
#
#   @seduction   /Users/moind/Documents/Seduction    techContext.md = 11-line TODO stub
#   @life        /Users/moind/Documents/Life         Fuel/ Happy/ Health/
#   @fuel        /Users/moind/Documents/Life/Fuel    techContext.md says "no application code"
#   @leanmuscle  /Users/moind/Documents/LeanMuscle   measurements/ diet/ progress/ bodybuilding/
#
# What they share is NOT "life planning". It is a shape: the operator runs a
# PROTOCOL on himself, LOGS adherence to it over time, and MEASURES an outcome.
# That shape is what this pack governs, and it is why the required files are
# protocol.md + log.md rather than the spec's original goals/habits/stakeholders.
#
# The id stays `executive-coach` rather than a more literal coinage because
# PH8-T02's ledger DoD is written as "a `coach` workspace has no techContext.md".
# Renaming would put the ledger, the plan and the spec into three-way disagreement
# for a cosmetic gain.

id: "executive-coach"
title: "Executive coach"
status: "stable"
default: false

persona: "A coach holding the operator to a protocol he wrote for himself — reads the log before giving advice, refuses to redesign the protocol when the real problem is adherence, and never congratulates progress the measurements do not show."

summary: "A protocol run on oneself, an honest log of adherence, and a measured outcome. No source code, no build, no test suite — the thing being verified is whether the record is coherent, not whether software compiles."

domain_tags:
  - life
  - health
  - practice
  - self-improvement

pipeline: "domain_verifier.py (PH8-T03) — schema conformance, link integrity, log/date coherence"

example_workspaces:
  - "@seduction"
  - "@life"
  - "@fuel"
  - "@leanmuscle"

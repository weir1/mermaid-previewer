# Memory bank schema — executive-coach (PH8-T02).
#
# The five domain-neutral files stay REQUIRED: they are the OS's own bookkeeping
# (what this is, what is happening now, what happened, what was decided, what is
# broken) and they are just as meaningful for a training log as for a codebase.
# Dropping them would be swapping a domain for an excuse to keep less record.
#
# `techContext` is PROHIBITED on the strength of the workspaces' own words —
# @fuel's copy reads "Pure Markdown Life Operating System. No application code.
# No runtime. No build process… nothing to compile, test, or deploy", and
# @seduction's has sat as an untouched `> TODO: Document the tech stack` stub.
# A required file whose owner has correctly identified it as inapplicable is a
# check that teaches people to ignore checks.
#
# `systemPatterns` stays OPTIONAL rather than prohibited: "the patterns I keep
# repeating" is a genuinely useful file for a practice workspace, and several of
# these four already have one worth keeping.
#
# Note the two additions are the point of the whole role. `protocol` is what the
# operator has committed to doing; `log` is what he actually did. A workspace that
# has the first without the second is a plan nobody is following, and that gap is
# precisely what PH8-T03's verifier is built to be able to FAIL on.

memory:
  required:
    - projectbrief
    - activeContext
    - progress
    - decisions
    - knownIssues
    - protocol
    - log
  optional:
    - systemPatterns
    - INDEX
    - measurements
    - stakeholders
  prohibited:
    - techContext

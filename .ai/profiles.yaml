# .ai/profiles.yaml — how much governance ceremony this workspace runs (PH26-T01, Goal G21).
#
# A workspace selects one of these with `profile:` in .ai/workspace.yaml. Omitting
# the key resolves to `full`, which is what all 46 governed workspaces ran before
# this file existed — so nothing outside the workspaces that opt in changes.
#
# ⚠️ THE CLOSED SET OF KNOBS. A profile may move `work_max` and `fast_closure` and
# NOTHING ELSE. There is deliberately no knob for the validation gate, the test
# suite, the pre-work brief, plan-before-code, or the pre-push self-review — a
# profile that could weaken proof would not be a lighter OS, it would be a
# different OS wearing this one's name. `workspace_profile.KNOBS` is that set and
# `tests/test_workspace_profile.py` fails the day a pack here declares a key
# outside it. Add a knob only by arguing for it there first.
#
# One-line values only. The bundled reader (policy_engine.mini_yaml_load, used
# whenever real PyYAML is absent) refuses `>`/`|` block scalars rather than
# silently truncating them.

full:
  title: "Full"
  summary: "The kernel's own discipline — 2 work tasks a session, closure run step by step. Right where one task rewrites an enforcement path and deserves a whole session."
  work_max: 2
  fast_closure: false

lite:
  title: "Lite"
  summary: "For a product workspace in a build sprint — 8 work slots, and closure collapsed to `just wrap` → self-review → `just land`. Every gate still fires; only the slot count and the number of commands move."
  work_max: 8
  fast_closure: true

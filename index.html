<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mermaid Full Page Preview</title>
    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
        import svgPanZoom from 'https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.1/dist/svg-pan-zoom.min.js';

        mermaid.initialize({
            startOnLoad: true,
            theme: 'default',
            securityLevel: 'loose'
        });

        const preview = document.getElementById('preview');
        const errorMsg = document.getElementById('error');
        const instruction = document.getElementById('instruction');
        const pasteBtn = document.getElementById('paste-btn');
        const hiddenInput = document.getElementById('hidden-input');

        let panZoomInstance = null;

        async function renderDiagram(code) {
            if (!code || !code.trim()) return;

            try {
                errorMsg.style.display = 'none';
                instruction.style.display = 'none';

                if (panZoomInstance) {
                    panZoomInstance.destroy();
                    panZoomInstance = null;
                }

                const { svg } = await mermaid.render('mermaid-svg', code.trim());
                preview.innerHTML = svg;

                // Add pan and zoom capabilities to the rendered SVG
                const svgElement = preview.querySelector('svg');
                if (svgElement) {
                    svgElement.style.width = '100%';
                    svgElement.style.height = '100%';
                    panZoomInstance = svgPanZoom(svgElement, {
                        zoomEnabled: true,
                        controlIconsEnabled: true,
                        fit: true,
                        center: true,
                        minZoom: 0.1,
                        maxZoom: 50
                    });
                }
            } catch (err) {
                errorMsg.textContent = err.message || err.str || 'Syntax error';
                errorMsg.style.display = 'block';
            }
        }

        // 1. Listen for global paste events (Cmd+V)
        window.addEventListener('paste', (e) => {
            const pastedText = (e.clipboardData || window.clipboardData).getData('text');
            if (pastedText) {
                renderDiagram(pastedText);
            }
        });

        // 2. Button for explicitly reading clipboard
        pasteBtn.addEventListener('click', async () => {
            try {
                const text = await navigator.clipboard.readText();
                if (text) {
                    renderDiagram(text);
                } else {
                    alert("Clipboard is empty or contains no text.");
                }
            } catch (err) {
                // Fallback for browsers that block clipboard API
                hiddenInput.style.display = 'block';
                hiddenInput.focus();
                alert("Please press Cmd+V to paste into the box.");
            }
        });

        // 3. Fallback hidden input just in case
        hiddenInput.addEventListener('input', (e) => {
            if (hiddenInput.value) {
                renderDiagram(hiddenInput.value);
                hiddenInput.value = '';
                hiddenInput.style.display = 'none';
            }
        });

        // Initial sample render
        const sample = `graph TD\n    A[Click 'Paste from Clipboard' below] --> B{Or press Cmd + V}\n    B --> C[See it full screen!]`;
        renderDiagram(sample);

    </script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            background: #ffffff;
        }
        #instruction {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 100;
            pointer-events: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        #error {
            position: absolute;
            bottom: 80px;
            left: 20px;
            right: 20px;
            color: #d9534f;
            background: #fdf7f7;
            padding: 15px;
            border: 1px solid #d9534f;
            border-radius: 8px;
            display: none;
            font-size: 14px;
            white-space: pre-wrap;
            z-index: 100;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-height: 200px;
            overflow-y: auto;
        }
        #preview {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        svg {
            width: 100%;
            height: 100%;
        }
        #paste-btn {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #007bff;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 24px;
            font-size: 16px;
            cursor: pointer;
            z-index: 200;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: background 0.2s;
        }
        #paste-btn:hover {
            background: #0056b3;
        }
        #hidden-input {
            position: absolute;
            bottom: 70px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 300;
            display: none;
            padding: 10px;
            width: 300px;
        }
    </style>
</head>
<body>
    <div id="instruction">Paste your Mermaid code to render</div>
    <div id="error"></div>
    <div id="preview"></div>
    <button id="paste-btn">📋 Paste from Clipboard</button>
    <textarea id="hidden-input" placeholder="Paste here (Cmd+V)"></textarea>
</body>
</html>

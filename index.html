<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mermaid Editor & Previewer</title>
    <script src="https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.1/dist/svg-pan-zoom.min.js"></script>
    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';

        mermaid.initialize({
            startOnLoad: true,
            theme: 'default',
            securityLevel: 'loose'
        });

        const editor = document.getElementById('editor');
        const previewBtn = document.getElementById('preview-btn');
        const overlay = document.getElementById('fullscreen-overlay');
        const closeBtn = document.getElementById('close-btn');
        const previewContainer = document.getElementById('preview-container');
        const errorMsg = document.getElementById('error');

        let panZoomInstance = null;

        previewBtn.addEventListener('click', async () => {
            const code = editor.value.trim();
            if (!code) {
                errorMsg.textContent = "Please enter some Mermaid code first.";
                errorMsg.style.display = 'block';
                return;
            }

            try {
                errorMsg.style.display = 'none';

                if (panZoomInstance) {
                    panZoomInstance.destroy();
                    panZoomInstance = null;
                }

                // Render the diagram
                const { svg } = await mermaid.render('mermaid-svg', code);
                previewContainer.innerHTML = svg;

                // Show overlay
                overlay.style.display = 'flex';

                // Add pan and zoom capabilities to the rendered SVG
                const svgElement = previewContainer.querySelector('svg');
                if (svgElement) {
                    svgElement.style.width = '100%';
                    svgElement.style.height = '100%';
                    panZoomInstance = svgPanZoom(svgElement, {
                        zoomEnabled: true,
                        controlIconsEnabled: true,
                        fit: true,
                        center: true,
                        minZoom: 0.1,
                        maxZoom: 50
                    });
                }
            } catch (err) {
                errorMsg.textContent = err.message || err.str || 'Syntax error';
                errorMsg.style.display = 'block';
            }
        });

        closeBtn.addEventListener('click', () => {
            overlay.style.display = 'none';
            if (panZoomInstance) {
                panZoomInstance.destroy();
                panZoomInstance = null;
            }
            previewContainer.innerHTML = ''; // Clear it out to save memory
        });

    </script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 80%;
            max-width: 1000px;
            margin-top: 50px;
            display: flex;
            flex-direction: column;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h2 {
            margin-top: 0;
            color: #333;
        }
        textarea {
            width: 100%;
            height: 400px;
            resize: vertical;
            border: 1px solid #ddd;
            padding: 15px;
            font-family: monospace;
            font-size: 15px;
            border-radius: 8px;
            outline: none;
            box-sizing: border-box;
            background: #fafafa;
        }
        textarea:focus {
            border-color: #007bff;
            background: #ffffff;
        }
        #preview-btn {
            margin-top: 20px;
            align-self: flex-end;
            background: #007bff;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        #preview-btn:hover {
            background: #0056b3;
        }
        #error {
            color: #d9534f;
            background: #fdf7f7;
            padding: 15px;
            margin-top: 20px;
            border: 1px solid #d9534f;
            border-radius: 8px;
            display: none;
            font-size: 14px;
            white-space: pre-wrap;
        }

        /* Fullscreen Overlay Styles */
        #fullscreen-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: white;
            z-index: 1000;
            display: none;
            flex-direction: column;
        }
        #overlay-header {
            padding: 15px 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #overlay-header h3 {
            margin: 0;
            color: #333;
        }
        #close-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            font-weight: bold;
        }
        #close-btn:hover {
            background: #c82333;
        }
        #preview-container {
            flex: 1;
            width: 100vw;
            overflow: hidden; /* Pan zoom handles this */
            display: flex;
            align-items: center;
            justify-content: center;
        }
        svg {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Paste Mermaid Code</h2>
        <textarea id="editor" placeholder="Paste your Mermaid code here..."></textarea>
        <button id="preview-btn">Show Full Preview</button>
        <div id="error"></div>
    </div>

    <div id="fullscreen-overlay">
        <div id="overlay-header">
            <h3>Mermaid Fullscreen Preview</h3>
            <button id="close-btn">Close</button>
        </div>
        <div id="preview-container"></div>
    </div>
</body>
</html>

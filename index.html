<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mermaid Editor & Previewer</title>
    <script src="https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.1/dist/svg-pan-zoom.min.js"></script>
    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';

        mermaid.initialize({
            startOnLoad: true,
            theme: 'default',
            securityLevel: 'loose'
        });

        const editor = document.getElementById('editor');
        const previewBtn = document.getElementById('preview-btn');
        const overlay = document.getElementById('fullscreen-overlay');
        const closeBtn = document.getElementById('close-btn');
        const previewContainer = document.getElementById('preview-container');
        const errorMsg = document.getElementById('error');

        function preprocessMermaid(code) {
            let lines = code.split('\n');
            let inFlowchart = false;

            const nodeRegex = /([a-zA-Z0-9_]+)\s*(\[\[|\[\(|\[\/|\[\\|\(\[|{{|\[|\(|{|>)(?!\s*")(.+?)(?<!")(\]\]|\)\]|\/\]|\\\]|\]\)|}}|\]|\)|})/g;

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i];
                if (line.trim().match(/^(flowchart|graph)\b/)) {
                    inFlowchart = true;
                } else if (line.trim().match(/^(sequenceDiagram|classDiagram|stateDiagram|gantt|pie|journey|gitGraph|erDiagram)/)) {
                    inFlowchart = false;
                }

                if (inFlowchart) {
                    line = line.replace(nodeRegex, (match, id, open, text, close) => {
                        if (text.includes('-->') || text.includes('---') || text.includes('==>')) return match;
                        let escapedText = text.replace(/"/g, '#quot;');
                        return `${id}${open}"${escapedText}"${close}`;
                    });
                    lines[i] = line;
                }
            }
            return lines.join('\n');
        }

        let panZoomInstance = null;

        previewBtn.addEventListener('click', async () => {
            let code = editor.value.trim();
            if (!code) {
                errorMsg.textContent = "Please enter some Mermaid code first.";
                errorMsg.style.display = 'block';
                return;
            }

            try {
                errorMsg.style.display = 'none';

                if (panZoomInstance) {
                    panZoomInstance.destroy();
                    panZoomInstance = null;
                }

                code = preprocessMermaid(code);

                // Render the diagram
                const { svg } = await mermaid.render('mermaid-svg', code);
                previewContainer.innerHTML = svg;
                window.currentMermaidSvg = svg;

                // Show overlay
                overlay.style.display = 'flex';

                // Add pan and zoom capabilities to the rendered SVG
                const svgElement = previewContainer.querySelector('svg');
                if (svgElement) {
                    svgElement.style.width = '100%';
                    svgElement.style.height = '100%';
                    panZoomInstance = svgPanZoom(svgElement, {
                        zoomEnabled: true,
                        controlIconsEnabled: true,
                        fit: true,
                        center: true,
                        minZoom: 0.1,
                        maxZoom: 50,
                        mouseWheelZoomEnabled: false, // Disable default to override with custom wheel logic
                        customEventsHandler: {
                            init: function(options) {
                                this.wheelListener = function(e) {
                                    e.preventDefault();
                                    if (e.ctrlKey || e.metaKey) {
                                        // Pinch-to-zoom or Ctrl+Scroll
                                        // deltaY is negative when zooming in
                                        const zoomFactor = 1 - (e.deltaY * 0.01);
                                        options.instance.zoomAtPoint(
                                            options.instance.getZoom() * zoomFactor,
                                            {x: e.clientX, y: e.clientY}
                                        );
                                    } else {
                                        // Two-finger scroll to pan
                                        options.instance.panBy({
                                            x: -e.deltaX,
                                            y: -e.deltaY
                                        });
                                    }
                                };
                                options.svgElement.addEventListener('wheel', this.wheelListener, {passive: false});
                            },
                            destroy: function(options) {
                                options.svgElement.removeEventListener('wheel', this.wheelListener);
                            }
                        }
                    });
                }
            } catch (err) {
                errorMsg.textContent = err.message || err.str || 'Syntax error';
                errorMsg.style.display = 'block';
            }
        });

        closeBtn.addEventListener('click', () => {
            overlay.style.display = 'none';
            if (panZoomInstance) {
                panZoomInstance.destroy();
                panZoomInstance = null;
            }
            previewContainer.innerHTML = ''; // Clear it out to save memory
            // Exit fullscreen if we are in it
            if (document.fullscreenElement) {
                document.exitFullscreen().catch(err => console.log(err));
            }
        });

        // Fullscreen API toggle
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                overlay.requestFullscreen().catch(err => {
                    alert(`Error attempting to enable fullscreen: ${err.message}`);
                });
                fullscreenBtn.textContent = "Exit Fullscreen";
            } else {
                document.exitFullscreen();
                fullscreenBtn.textContent = "Go Fullscreen";
            }
        });

        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                fullscreenBtn.textContent = "Go Fullscreen";
            }
        });

        // Download Image Feature
        const downloadBtn = document.getElementById('download-btn');
        downloadBtn.addEventListener('click', () => {
            if (!window.currentMermaidSvg) return;

            // Create a temporary div to parse the original SVG string
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = window.currentMermaidSvg;
            const svgEl = tempDiv.querySelector('svg');
            if (!svgEl) return;

            // Parse dimensions
            let width, height;
            const viewBox = svgEl.getAttribute('viewBox');
            if (viewBox) {
                const parts = viewBox.split(' ');
                width = parseFloat(parts[2]);
                height = parseFloat(parts[3]);
            } else {
                width = parseFloat(svgEl.getAttribute('width') || '800');
                height = parseFloat(svgEl.getAttribute('height') || '600');
            }

            // Define scale for high-quality export
            const scale = 3;
            svgEl.setAttribute('width', width * scale);
            svgEl.setAttribute('height', height * scale);

            // Remove style attribute that restricts width/height (max-width)
            svgEl.removeAttribute('style');

            const svgData = new XMLSerializer().serializeToString(svgEl);
            const canvas = document.createElement('canvas');
            canvas.width = width * scale;
            canvas.height = height * scale;
            const ctx = canvas.getContext('2d');

            const img = new Image();
            img.onload = () => {
                ctx.fillStyle = 'white'; // White background
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0);

                const link = document.createElement('a');
                link.download = 'mermaid-diagram.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            };
            img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgData)));
        });

        // Drag and Drop File Support
        editor.addEventListener('dragover', (e) => {
            e.preventDefault();
            e.stopPropagation();
            editor.style.borderColor = '#007bff';
            editor.style.background = '#e9f5ff';
        });

        editor.addEventListener('dragleave', (e) => {
            e.preventDefault();
            e.stopPropagation();
            editor.style.borderColor = '#ddd';
            editor.style.background = '#fafafa';
        });

        editor.addEventListener('drop', (e) => {
            e.preventDefault();
            e.stopPropagation();
            editor.style.borderColor = '#ddd';
            editor.style.background = '#fafafa';

            if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                const file = e.dataTransfer.files[0];
                const reader = new FileReader();
                reader.onload = (event) => {
                    editor.value = event.target.result;
                };
                reader.readAsText(file);
            }
        });

        // Keyboard Shortcuts
        document.addEventListener('keydown', (e) => {
            // Cmd+Enter or Ctrl+Enter to trigger preview from editor
            if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
                e.preventDefault();
                previewBtn.click();
                return;
            }

            if (overlay.style.display === 'flex') {
                // F key to toggle fullscreen
                if (e.key.toLowerCase() === 'f') {
                    e.preventDefault();
                    fullscreenBtn.click();
                    return;
                }

                // Escape to close preview (unless in browser fullscreen, which browser handles)
                if (e.key === 'Escape' && !document.fullscreenElement) {
                    closeBtn.click();
                    return;
                }

                if (panZoomInstance) {
                    const panStep = 50; // pixels to pan per keypress
                    switch (e.key) {
                        case 'ArrowLeft':
                            panZoomInstance.panBy({x: panStep, y: 0});
                            e.preventDefault();
                            break;
                        case 'ArrowRight':
                            panZoomInstance.panBy({x: -panStep, y: 0});
                            e.preventDefault();
                            break;
                        case 'ArrowUp':
                            panZoomInstance.panBy({x: 0, y: panStep});
                            e.preventDefault();
                            break;
                        case 'ArrowDown':
                            panZoomInstance.panBy({x: 0, y: -panStep});
                            e.preventDefault();
                            break;
                    }
                }
            }
        });

    </script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 80%;
            max-width: 1000px;
            margin-top: 50px;
            display: flex;
            flex-direction: column;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h2 {
            margin-top: 0;
            color: #333;
        }
        textarea {
            width: 100%;
            height: 400px;
            resize: vertical;
            border: 1px solid #ddd;
            padding: 15px;
            font-family: monospace;
            font-size: 15px;
            border-radius: 8px;
            outline: none;
            box-sizing: border-box;
            background: #fafafa;
        }
        textarea:focus {
            border-color: #007bff;
            background: #ffffff;
        }
        #preview-btn {
            margin-top: 20px;
            align-self: flex-end;
            background: #007bff;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        #preview-btn:hover {
            background: #0056b3;
        }
        #error {
            color: #d9534f;
            background: #fdf7f7;
            padding: 15px;
            margin-top: 20px;
            border: 1px solid #d9534f;
            border-radius: 8px;
            display: none;
            font-size: 14px;
            white-space: pre-wrap;
        }

        /* Guide Styles */
        .guide {
            margin-top: 20px;
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            padding: 15px 20px;
            border-radius: 8px;
            font-size: 14px;
            color: #555;
        }
        .guide h4 {
            margin: 0 0 10px 0;
            color: #333;
        }
        .guide ul {
            margin: 0;
            padding-left: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .guide li {
            margin-bottom: 4px;
        }

        /* Fullscreen Overlay Styles */
        #fullscreen-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: white;
            z-index: 1000;
            display: none;
            flex-direction: column;
        }
        #overlay-header {
            padding: 15px 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #overlay-header h3 {
            margin: 0;
            color: #333;
        }
        .header-buttons {
            display: flex;
            gap: 10px;
        }
        .secondary-btn {
            background: #6c757d;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            font-weight: bold;
        }
        .secondary-btn:hover {
            background: #5a6268;
        }
        #close-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            font-weight: bold;
        }
        #close-btn:hover {
            background: #c82333;
        }
        #preview-container {
            flex: 1;
            width: 100vw;
            overflow: hidden; /* Pan zoom handles this */
            display: flex;
            align-items: center;
            justify-content: center;
        }
        svg {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Paste Mermaid Code</h2>
        <textarea id="editor" placeholder="Paste your Mermaid code here, or drag and drop a .mmd/.txt file..."></textarea>
        <button id="preview-btn">Show Full Preview (Cmd+Enter)</button>
        <div id="error"></div>

        <div class="guide">
            <h4>💡 Quick Guide</h4>
            <ul>
                <li><strong>Cmd + Enter:</strong> Show Preview</li>
                <li><strong>Drag & Drop:</strong> Load a `.mmd` or `.txt` file</li>
                <li><strong>F:</strong> Toggle Fullscreen (while in preview)</li>
                <li><strong>Esc:</strong> Close Preview</li>
                <li><strong>Arrows / Scroll:</strong> Pan around diagram</li>
                <li><strong>Cmd + Scroll / Pinch:</strong> Zoom diagram</li>
            </ul>
        </div>
    </div>

    <div id="fullscreen-overlay">
        <div id="overlay-header">
            <h3>Mermaid Fullscreen Preview</h3>
            <div class="header-buttons">
                <button id="download-btn" class="secondary-btn">Download Image</button>
                <button id="fullscreen-btn" class="secondary-btn">Go Fullscreen</button>
                <button id="close-btn">Close</button>
            </div>
        </div>
        <div id="preview-container"></div>
    </div>
</body>
</html>
